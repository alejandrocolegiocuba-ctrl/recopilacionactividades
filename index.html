<head>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231d4ed8'/%3E%3Cpath d='M9 9h14M9 16h14M9 23h9' stroke='white' stroke-width='3'/%3E%3C/svg%3E">
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fc;color:#172846;font:1rem/1.6 system-ui,sans-serif}header{background:#17345e;color:white;border-bottom:6px solid #71a8ff}.wrap{max-width:1100px;margin:auto;padding:3rem 1.5rem}.label{font-size:.875rem;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:#c0d7ff;margin:0 0 1rem}h1{font-size:clamp(2rem,5vw,3.3rem);line-height:1.15;letter-spacing:-.035em;margin:0;overflow-wrap:anywhere}header p:last-child{margin:1.25rem 0 0;color:#e0eaff}.heading{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;flex-wrap:wrap;margin-bottom:1.5rem}h2{font-size:1.35rem;margin:0}.count{color:#53637d;font-size:.875rem}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:1.5rem}.card{max-width:420px;background:white;border:1px solid #d9e2ef;border-radius:20px;overflow:hidden;box-shadow:0 8px 24px #17345e08}.card-top{background:#dff8eb;padding:1.75rem;display:flex;align-items:center;justify-content:space-between}.icon{font-size:2.5rem}.tag{font-size:.875rem;font-weight:700;color:#155537;background:#ffffffb3;padding:.35rem .8rem;border-radius:30px}.content{padding:1.5rem}.content h3{font-size:1.5rem;margin:0 0 .5rem}.content p{margin:0 0 1.5rem;color:#53637d}.button{display:inline-block;background:#1d4ed8;color:white;border-radius:10px;padding:.8rem 1.2rem;text-decoration:none;font-weight:700}.button:hover{background:#173da9}.button:focus-visible{outline:3px solid #172846;outline-offset:4px}footer{color:#53637d;font-size:.875rem}footer .wrap{padding-top:1.5rem;border-top:1px solid #d9e2ef}main{min-height:55vh}@media(max-width:500px){.wrap{padding:2rem 1rem}.card{max-width:none}}
</style>
</head>
<body>
<header><div class="wrap"><p class="label">Aprender y practicar</p><h1>Recopilación de actividades</h1><p>Elige una actividad para empezar.</p></div></header>
<main class="wrap"><div class="heading"><h2>Todas las actividades</h2><span class="count">1 actividad</span></div>
<div class="grid">

<article class="card"><div class="card-top"><span class="icon" aria-hidden="true">🎧</span><span class="tag">Lengua</span></div><div class="content"><h3>Mis Dictados</h3><p>Escucha frases cortas, escribe en tu cuaderno y comprueba el texto con ayuda de pictogramas.</p><a class="button" href="actividades/dictados/index.html">Abrir Mis Dictados →</a></div></article>
</div></main>
<footer><div class="wrap">Recopilación de actividades</div></footer>
